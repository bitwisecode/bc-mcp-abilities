name: Development WPCS Autoformat
on:
  push:
    branches: [feat/agent-abilities-foundation]
permissions:
  contents: write
concurrency:
  group: bc-mcp-format-dev
  cancel-in-progress: false
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-abilities-foundation
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Fix auto-fixable WPCS violations
        run: ./vendor/bin/phpcbf || test "$?" -eq 1
      - name: Commit formatting changes only
        run: |
          if ! git diff --quiet -- bc-mcp-abilities.php includes/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bc-mcp-abilities.php includes/
            git commit -m "style: apply WordPress Coding Standards automatic fixes"
            git push origin HEAD:feat/agent-abilities-foundation
          fi

name: One-time Agent parity WordPressCS formatting
on:
  push:
    branches: [feat/agent-parity-content-elementor]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-parity-content-elementor
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - name: Autoformat changed PHP
        run: ./vendor/bin/phpcbf || test "$?" -eq 1
      - name: Commit WordPressCS style changes
        run: |
          if ! git diff --quiet -- includes/ tests/ bc-mcp-abilities.php; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add includes/ tests/ bc-mcp-abilities.php
            git commit -m "style: apply WordPress Coding Standards to new Agent parity abilities"
            git push origin HEAD:feat/agent-parity-content-elementor
          fi

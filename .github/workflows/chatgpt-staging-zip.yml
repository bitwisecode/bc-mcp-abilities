name: Build ChatGPT staging ZIP
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create installable WordPress plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bc-mcp-abilities/includes dist/bc-mcp-abilities/claude-extension/server
          cp bc-mcp-abilities.php readme.txt LICENSE uninstall.php dist/bc-mcp-abilities/
          cp includes/*.php dist/bc-mcp-abilities/includes/
          cp claude-extension/server/index.js dist/bc-mcp-abilities/claude-extension/server/
          (cd dist && zip -qr bc-mcp-abilities.zip bc-mcp-abilities)
          unzip -l dist/bc-mcp-abilities.zip
      - name: Upload preview build (not a production release)
        uses: actions/upload-artifact@v4
        with:
          name: bc-mcp-abilities-chatgpt-staging
          path: dist/bc-mcp-abilities.zip
          retention-days: 14

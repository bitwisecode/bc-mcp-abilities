name: WPToolix Public MCP Connectivity Diagnostics
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public metadata from outside WordPress hosting
        shell: bash
        run: |
          set -euo pipefail
          base="https://wptoolix.com"
          for path in \
            "/.well-known/oauth-protected-resource/wp-json/bc-mcp/v1/server" \
            "/.well-known/oauth-authorization-server/bc-mcp" \
            "/wp-json/bc-mcp/v1/oauth/resource"; do
            # Permit a short HTTPS canonical redirect chain, but never a different host.
            result=$(curl -sS --location --max-redirs 3 --proto-redir '=https' --max-time 20 \
              -o /tmp/public-mcp.json -w '%{http_code} %{url_effective}' "$base$path")
            read -r code final_url <<< "$result"
            echo "$path: HTTP $code; final URL $final_url"
            if [[ "$final_url" != "$base" && "$final_url" != "$base/"* ]]; then
              echo "OAuth metadata redirected away from the expected HTTPS origin"
              exit 1
            fi
            if [[ "$code" != "200" ]]; then
              echo "Unexpected public metadata HTTP status from GitHub runner"
              exit 1
            fi
            jq -e 'type == "object"' /tmp/public-mcp.json >/dev/null
          done
      - name: Probe unauthenticated MCP initialization safely (no writes)
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 20 --max-redirs 0 \
            -D /tmp/mcp-headers.txt -o /tmp/mcp-result.json \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"bc-diagnostics","version":"1.0"}}}' \
            "https://wptoolix.com/wp-json/bc-mcp/v1/server"
          echo "HTTP status from GitHub runner:"
          head -n 1 /tmp/mcp-headers.txt
          echo "Challenge header (if present):"
          grep -i '^www-authenticate:' /tmp/mcp-headers.txt || true
          echo "MCP response keys:"
          jq -r 'keys[]?' /tmp/mcp-result.json 2>/dev/null || true
          # Current site is expected to return 401 before the fix is installed.

      - name: Confirm external token endpoint accepts OAuth form requests
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 15 --max-redirs 0 \
            -X POST -H "Content-Type: application/x-www-form-urlencoded" \
            --data 'grant_type=authorization_code&client_id=invalid-diagnostic-client&code=invalid&code_verifier=invalid' \
            -o /tmp/bc-token-probe.json -w '%{http_code}' \
            'https://wptoolix.com/bc-mcp/oauth/token')
          echo "OAuth token endpoint returned HTTP $status for intentionally invalid client"
          if [[ "$status" != "400" ]]; then
            echo "Token requests are not reaching the expected WordPress OAuth handler"
            exit 1
          fi
          jq -e '.error == "invalid_client"' /tmp/bc-token-probe.json > /dev/null

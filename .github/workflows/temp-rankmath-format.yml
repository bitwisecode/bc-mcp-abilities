name: Temporary format Rank Math integration
on:
  push:
    branches: ['feature/rank-math-redirect-abilities']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rank-math-redirect-abilities
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Autoformat changed PHP file using WPCS
        run: |
          vendor/bin/phpcbf includes/class-bc-mcp-abilities-rank-math-redirects.php includes/class-bc-mcp-abilities-admin.php || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-bc-mcp-abilities-rank-math-redirects.php includes/class-bc-mcp-abilities-admin.php
          if ! git diff --cached --quiet; then
            git commit -m "Apply WordPress Coding Standards autoformat"
            git push
          fi

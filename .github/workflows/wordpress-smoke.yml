name: WordPress Abilities Smoke Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Start a disposable WordPress installation
        run: npx --yes @wordpress/env start
      - name: Enable WordPress debugging for plugin-review regression
        run: |
          npx --yes @wordpress/env run cli wp config set WP_DEBUG true --raw
          npx --yes @wordpress/env run cli wp eval 'if ( ! defined( "WP_DEBUG" ) || ! WP_DEBUG ) { WP_CLI::error( "WP_DEBUG must be enabled for this release-review smoke run." ); }'
      - name: Activate BC MCP Abilities
        run: npx --yes @wordpress/env run cli wp plugin activate bc-mcp-abilities
      - name: Verify registered abilities and authorization defaults
        run: |
          npx --yes @wordpress/env run cli wp eval-file /var/www/html/wp-content/plugins/bc-mcp-abilities/tests/smoke.php
          npx --yes @wordpress/env run cli wp eval-file /var/www/html/wp-content/plugins/bc-mcp-abilities/tests/standalone-smoke.php
          npx --yes @wordpress/env run cli wp eval-file /var/www/html/wp-content/plugins/bc-mcp-abilities/tests/chatgpt-connection-smoke.php
          npx --yes @wordpress/env run cli wp eval-file /var/www/html/wp-content/plugins/bc-mcp-abilities/tests/oauth-lifecycle-smoke.php
          npx --yes @wordpress/env run cli wp eval-file /var/www/html/wp-content/plugins/bc-mcp-abilities/tests/plugin-directory-review-smoke.php
          npx --yes @wordpress/env run cli wp eval-file /var/www/html/wp-content/plugins/bc-mcp-abilities/tests/agent-parity-smoke.php
          npx --yes @wordpress/env run cli wp eval-file /var/www/html/wp-content/plugins/bc-mcp-abilities/tests/admin-dashboard-smoke.php
          npx --yes @wordpress/env run cli wp eval-file /var/www/html/wp-content/plugins/bc-mcp-abilities/tests/taxonomy-menu-smoke.php
          npx --yes @wordpress/env run cli wp eval-file /var/www/html/wp-content/plugins/bc-mcp-abilities/tests/activity-security-smoke.php
          npx --yes @wordpress/env run cli wp option update bc_mcp_abilities_disabled_reads '["list-taxonomies"]' --format=json
          npx --yes @wordpress/env run cli wp eval-file /var/www/html/wp-content/plugins/bc-mcp-abilities/tests/read-disabled-smoke.php
          npx --yes @wordpress/env run cli wp option delete bc_mcp_abilities_disabled_reads
      - name: Stop disposable WordPress environment
        if: always()
        run: npx --yes @wordpress/env stop || true
